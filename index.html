<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Día de las Flores Amarillas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Comic Sans MS', 'Arial', sans-serif;
      color: #fff;
    }

    /* Pantalla de inicio */
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
      transition: opacity 1s ease;
    }

    .sunflower-icon {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, #ffe600 20%, #ff9900 60%, transparent 70%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 65px;
      box-shadow: 0 0 30px #ffcc00, 0 0 60px #ffaa00;
      animation: pulse 2s infinite ease-in-out;
    }

    #start-screen h2 {
      margin-top: 25px;
      font-size: 28px;
      color: #ffeb3b;
      text-shadow: 0 0 10px #ffea00;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px #ffcc00; }
      50% { transform: scale(1.1); box-shadow: 0 0 50px #ffea00, 0 0 80px #ff9900; }
    }

    /* Título Principal */
    #main-title {
      position: absolute;
      top: 5%;
      width: 100%;
      text-align: center;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
    }

    #main-title h1 {
      font-size: 3rem;
      color: #fff;
      text-shadow: 0 0 10px #ffea00, 0 0 20px #ffaa00, 0 0 30px #ff9900;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Pantalla de Bienvenida -->
  <div id="start-screen" onclick="startApp()">
    <div class="sunflower-icon">🌻</div>
    <h2>Toca para iniciar</h2>
  </div>

  <!-- Título principal -->
  <div id="main-title">
    <h1>🌻 Feliz día de las Flores Amarillas 🌻</h1>
  </div>

  <canvas id="galaxyCanvas"></canvas>

  <script>
    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Mensajes para las tarjetas/flores
    const messages = [
      "Eres mi persona favorita 💛",
      "Siempre me haces sonreír ✨",
      "Un detalle amarillo para ti 🌻",
      "Eres luz en mi vida 🌟",
      "Nunca dejes de brillar 🔥",
      "Solo para ti 💖",
      "Que tengas un hermoso día 🌼",
      "Mi flor favorita 🌻",
      "Eres muy especial para mí 💕"
    ];

    // Array de objetos de la galaxia
    const numItems = 120;
    const items = [];

    class GalaxyItem {
      constructor() {
        this.reset();
      }

      reset() {
        // Coordenadas esféricas / espirales para forma de galaxia
        this.angle = Math.random() * Math.PI * 2;
        this.radius = 50 + Math.random() * (Math.min(width, height) * 0.45);
        this.z = (Math.random() - 0.5) * 500; // Profundidad
        this.speed = 0.002 + Math.random() * 0.003;
        
        this.text = messages[Math.floor(Math.random() * messages.length)];
        this.isFlower = Math.random() > 0.4; // 60% flores, 40% texto
        this.size = 15 + Math.random() * 20;
      }

      update() {
        this.angle += this.speed;
      }

      draw() {
        // Proyección 3D simple a 2D
        const fov = 300;
        const scale = fov / (fov + this.z);
        const x2d = (Math.cos(this.angle) * this.radius) * scale + width / 2;
        const y2d = (Math.sin(this.angle) * (this.radius * 0.4)) * scale + height / 2 + (this.z * 0.1);

        ctx.save();
        ctx.globalAlpha = Math.min(Math.max(scale - 0.2, 0.1), 1);

        if (this.isFlower) {
          // Dibujar Girasol
          ctx.font = `${this.size * scale}px serif`;
          ctx.fillText("🌻", x2d, y2d);
        } else {
          // Dibujar Texto con brillo
          ctx.font = `${Math.max(12 * scale, 10)}px 'Comic Sans MS', sans-serif`;
          ctx.fillStyle = "#ffeb3b";
          ctx.shadowColor = "#ffaa00";
          ctx.shadowBlur = 10;
          ctx.fillText(this.text, x2d, y2d);
        }

        ctx.restore();
      }
    }

    // Dibujar Núcleo Brillante Centro
    function drawCore() {
      const centerX = width / 2;
      const centerY = height / 2;

      const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 120);
      gradient.addColorStop(0, 'rgba(255, 255, 200, 1)');
      gradient.addColorStop(0.3, 'rgba(255, 200, 0, 0.8)');
      gradient.addColorStop(0.7, 'rgba(255, 140, 0, 0.3)');
      gradient.addColorStop(1, 'transparent');

      ctx.save();
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 120, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Inicializar objetos
    for (let i = 0; i < numItems; i++) {
      items.push(new GalaxyItem());
    }

    // Animación principal
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // Efecto estela
      ctx.fillRect(0, 0, width, height);

      drawCore();

      items.forEach(item => {
        item.update();
        item.draw();
      });

      requestAnimationFrame(animate);
    }

    // Iniciar aplicación
    function startApp() {
      const startScreen = document.getElementById('start-screen');
      const mainTitle = document.getElementById('main-title');

      startScreen.style.opacity = '0';
      setTimeout(() => {
        startScreen.style.display = 'none';
        mainTitle.style.opacity = '1';
      }, 1000);

      animate();
    }
  </script>
</body>
</html>
