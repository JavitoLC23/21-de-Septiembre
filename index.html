<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxia de Flores Amarillas 🌻</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; margin: 0; overflow: hidden;
            background-color: #000000;
            font-family: cursive, sans-serif;
            cursor: grab; -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent; 
        }
        body:active { cursor: grabbing; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
        
        #main-title {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            font-size: 4.5em; color: #FFFACD; text-shadow: 0 0 15px #FFD700, 0 0 25px #FFA500;
            z-index: 10; pointer-events: none; text-align: center; white-space: nowrap;
        }
        
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000000; display: flex; justify-content: center; align-items: center;
            flex-direction: column; z-index: 99999; 
            touch-action: manipulation; 
        }
        
        #start-button-image {
            width: 150px; height: auto; filter: drop-shadow(0 0 15px #FFD700) drop-shadow(0 0 25px #FFA500);
            animation: latido 1.5s infinite ease-in-out; pointer-events: none;
        }
        @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        #start-text { font-size: 1.8em; color: #FFFACD; text-shadow: 0 0 10px #FFD700; text-align: center; pointer-events: none; margin-top: 20px;}
        
        #love-card-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8);
            display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }
        #love-card {
            position: relative; width: 90%; max-width: 400px; aspect-ratio: 9 / 16;
            background-size: cover; background-position: center; border-radius: 20px;
            box-shadow: 0 0 30px #FFD700, 0 0 50px #FFA500; display: flex; justify-content: center; align-items: center; padding: 25px; text-align: center; overflow: hidden;
        }
        #love-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.4); z-index: 1; }
        #love-card-text { position: relative; font-size: 3em; color: #ffffff; text-shadow: 0 0 8px black, 0 0 15px black; z-index: 2; }
        @media (max-width: 768px) { #main-title { font-size: 3.4em; top: 25px; } #love-card-text { font-size: 2.8em; } }
    </style>
</head>
